<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poohead - Coming Soon</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F2C400;
            font-family: 'Baloo 2', sans-serif;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px 40px;
            border-bottom: 3px solid rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        h1 {
            font-size: clamp(3.5rem, 8vw, 6rem);
            line-height: 0.95;
            font-weight: 800;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.4rem;
            line-height: 1.4;
            max-width: 550px;
        }

        .pill {
            display: inline-block;
            background: #fff;
            border-radius: 999px;
            padding: 10px 22px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .cards {
            position: relative;
            height: 320px;
        }

        .card {
            position: absolute;
            width: 160px;
            height: 220px;
            background: white;
            border-radius: 16px;
            border: 3px solid #111;
            box-shadow: 0 14px 30px rgba(0,0,0,.2);
        }

        .card:nth-child(1) {
            transform: rotate(-20deg);
            left: 50px;
        }

        .card:nth-child(2) {
            transform: rotate(-10deg);
            left: 140px;
        }

        .card:nth-child(3) {
            transform: rotate(0deg);
            left: 230px;
        }

        .card:nth-child(4) {
            transform: rotate(10deg);
            left: 320px;
        }

        .card:nth-child(5) {
            transform: rotate(20deg);
            left: 410px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 800;
            padding: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            opacity: .7;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
            }

            p {
                margin: auto;
            }

            .cards {
                transform: scale(.8);
                margin: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">💩 POOHEAD</div>
</header>

<main>
    <div class="container">

        <div>
            <div class="pill">COMING SOON</div>

            <h1>
                The classic card game.<br>
                Reimagined.
            </h1>

            <p>
                Poohead is on its way. A modern take on the legendary
                Shithead card game, designed for quick laughs,
                tactical plays, and maximum chaos.
            </p>
        </div>

        <div class="cards">
            <div class="card"><div class="card-value">A♠</div></div>
            <div class="card"><div class="card-value">K♠</div></div>
            <div class="card"><div class="card-value">7♣</div></div>
            <div class="card"><div class="card-value">Q♦</div></div>
            <div class="card"><div class="card-value">3♠</div></div>
        </div>

    </div>
</main>

<footer>
    © 2026 Poohead Game • pooheadgame.com
</footer>

</body>
</html>
